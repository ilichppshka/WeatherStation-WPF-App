name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore WeatherStation.slnx

      - name: Build solution
        run: dotnet build WeatherStation.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test --solution WeatherStation.slnx -c Release --no-build
